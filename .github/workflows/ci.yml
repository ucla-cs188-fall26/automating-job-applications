name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Unit tests
        run: uv run pytest
      - name: Eval smoke (mock backend)
        run: uv run pocket-agent eval --suite smoke --backend mock --fail-under 1
