[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pocket-agent"
version = "0.1.0"
description = "Local form filler with memory. Nothing is submitted for you."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Pocket Agent contributors"}]
keywords = ["recruiting", "local-llm", "ollama", "jobs", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27.0",
  "jsonschema>=4.22.0",
  "playwright>=1.64.1",
  "pypdf>=5.0.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]
accounts = ["keyring>=25.0"]

[project.scripts]
pocket-agent = "pocket_agent.cli:main"

[project.urls]
Homepage = "https://github.com/linnkhant07/pocket_agent"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
